<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализ шахматных партий</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
        }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 5px;}
        h3 { color: #7f8c8d; text-align: center; font-weight: normal; margin-top: 0; }
        
        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
            color: #34495e;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: monospace;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        
        /* Стили для кнопок */
        .btn-group {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        
        .btn-analyze {
            background-color: #2ecc71;
            color: white;
            flex-grow: 1;
        }
        .btn-analyze:hover { background-color: #27ae60; }
        
        /* Синие кнопки для примеров */
        .btn-example {
            background-color: #3498db; 
            color: white;
        }
        .btn-example:hover { background-color: #2980b9; }

        .results {
            margin-top: 30px;
        }
        .results h2 {
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            color: #2c3e50;
        }
        .move-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 5px solid #bdc3c7;
            background: #fcfcfc;
        }
        .move-item.error {
            border-left-color: #e74c3c;
            background-color: #fdedec;
        }
        .move-item.clean {
            border-left-color: #2ecc71;
            background-color: #eafaf1;
        }
        .loader {
            text-align: center;
            font-size: 18px;
            color: #3498db;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Анализ шахматных партий</h1>
    <h3>Анализ тактических ошибок</h3>
    
    <form id="analyzeForm">
        <label for="fen">Начальная позиция (FEN):</label>
        <input type="text" id="fen" name="fen" value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1" placeholder="Введите FEN">
        
        <label for="moves">Ходы (через пробел, UCI или SAN/PGN):</label>
        <textarea id="moves" name="moves" placeholder="Например: e2e4 e7e5 или 1. e4 e5"></textarea>
        
        <div class="btn-group">
            <!-- Новые синие кнопки -->
            <button type="button" class="btn btn-example" onclick="loadExample(1)">Пример 1</button>
            <button type="button" class="btn btn-example" onclick="loadExample(2)">Пример 2</button>
            
            <button type="submit" class="btn btn-analyze">Проанализировать</button>
        </div>
    </form>

    <div class="loader" id="loader">⏳ Анализируем партию, это может занять некоторое время...</div>

    <div class="results">
        <h2>Ходы и Анализ</h2>
        <div id="resultsContainer">
            <p>Загрузите партию для анализа или выберите пример.</p>
        </div>
    </div>
</div>

<script>
    // Словарь с данными для примеров
    const examples = {
        1: {
            fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
            moves: "e2e4 c7c5 g1f3 a7a6 d2d4 c5d4 f3d4 e7e5 d4f3 g8f6 f3e5 d8a5 b1c3 a5e5 f1c4 b8c6 e1g1 f6e4 c3e4 e5e4 f1e1 e4e1 d1e1 f8e7 c1f4 c6a5 e1a5"
        },
        2: {
            fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
            moves: "1. e4 e5 2. f4 exf4 3. Bc4 Qh4+ 4. Kf1 b5 5. Bxb5 Nf6 6. Nf3 Qh6 7. d3 Nh5 8. Nh4 Qg5 9. Nf5 c6 10. g4 Nf6 11. Rg1 cxb5 12. h4 Qg5 13. h5 Qg5 14. Qf3 Ng8 15. Bxf4 Qf6 16. Nc3 Bc5 17. Nd5 Qxb2 18. Bd6 Bxg1 19. e5 Qxa1+ 20. Ke2 Na6 21. Nxg7+ Kd8 22. Qf6+ Nxf6 23. Be7#"
        }
    };

    // Функция, которая срабатывает при клике на "Пример 1" или "Пример 2"
    function loadExample(num) {
        const ex = examples[num];
        if (ex) {
            document.getElementById('fen').value = ex.fen;
            document.getElementById('moves').value = ex.moves;
        }
    }

    // Обработка отправки формы на сервер
    document.getElementById('analyzeForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const fen = document.getElementById('fen').value;
        const moves = document.getElementById('moves').value;
        const loader = document.getElementById('loader');
        const container = document.getElementById('resultsContainer');
        
        loader.style.display = 'block';
        container.innerHTML = '';
        
        const formData = new FormData();
        formData.append('fen', fen);
        formData.append('moves_text', moves);
        
        try {
            const response = await fetch('/api/analyze', {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            loader.style.display = 'none';
            
            if (result.success) {
                if (!result.data || result.data.length === 0) {
                    container.innerHTML = '<p>Партия проанализирована, ходы не найдены.</p>';
                    return;
                }
                
                let html = '';
                result.data.forEach(move => {
                    const isError = move.is_error;
                    const cssClass = isError ? 'error' : 'clean';
                    const icon = isError ? '🚨' : '✅';
                    const moveNum = Math.ceil(move.move_number / 2);
                    const dots = move.move_number % 2 !== 0 ? '.' : '...';
                    
                    html += `<div class="move-item ${cssClass}">
                        <strong>${icon} Ход ${moveNum}${dots} ${move.side} | ${move.uci}</strong><br>
                        Оценка: ${move.eval_before} ➔ ${move.eval_after}<br>`;
                    
                    if (isError) {
                        html += `<b style="color: #c0392b;">ОШИБКА!</b><br>`;
                        if (move.correct_move) html += `✅ Правильный ход: <code>${move.correct_move}</code><br>`;
                        if (move.scenario) html += `📝 Контекст: ${move.scenario}<br>`;
                        if (move.tactic_class !== null && move.tactic_class !== undefined) html += `⚔️ Тактика (класс): ${move.tactic_class}<br>`;
                    }
                    html += `</div>`;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `<p style="color: #e74c3c; font-weight: bold;">❌ Ошибка: ${result.error}</p>`;
            }
        } catch (error) {
            loader.style.display = 'none';
            container.innerHTML = `<p style="color: #e74c3c; font-weight: bold;">❌ Ошибка сети: ${error.message}</p>`;
        }
    });
</script>

</body>
</html>
